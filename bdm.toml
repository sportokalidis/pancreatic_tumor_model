[visualization]
export = true
# interval is in SIMULATION STEPS, not days. total_steps = total_days * 1440 / dt_minutes.
# Pick interval to get one frame per day:  interval = 1440 / dt_minutes
#   dt = 24h (1440 min) -> interval = 1    (1 step/day  -> 100 frames for 100 days)
#   dt = 6h  (360 min)  -> interval = 4    (4 steps/day)
#   dt = 10min          -> interval = 144  (else 14400 frames!)
interval = 1

[[visualize_agent]]
name = "TumorCell"
additional_data_members = ["color_"]

[[visualize_agent]]
name = "StellateCell"
additional_data_members = ["color_"]

[[visualize_agent]]
name = "EffectorTCell"
additional_data_members = ["color_"]

[[visualize_agent]]
name = "NKCell"
additional_data_members = ["color_"]

[[visualize_agent]]
name = "HelperTCell"
additional_data_members = ["color_"]

[[visualize_agent]]
name = "TRegCell"
additional_data_members = ["color_"]
